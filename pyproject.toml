[project]
name = "mmctl"
version = "0.1.0"
description = "Multi-Modal Continuous Triplet Loss (MMCTL): paper reproduction code"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.23,<2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3,<1.6",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "tensorflow>=2.13",
    "torch>=2.0",
    "h5py>=3.8",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# Extras for the full NEON reconstruction-training path (not needed for the
# demo / metrics / figure reproduction).
full = ["umap-learn>=0.5"]


# This repository is a collection of scripts plus the `mmctl` package used via
# the repo root (scripts add the root to sys.path), so uv manages the
# environment without building/installing the project itself.
[tool.uv]
package = false
